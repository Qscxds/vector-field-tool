# Round R: the three gates of CLAUDE.md on every push and pull request (typecheck, tests, build).
# No deploy here: Vercel builds main on its own.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The same major as the maintainer's machine (Node 24, npm 11).
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
